<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Disk Declutter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Mac Disk Declutter</h1>
            <div class="header-actions">
                <span id="space-total" class="space-badge">Space to free: 0 B</span>
                <button id="btn-settings" class="btn-icon" title="Settings">&#9881;</button>
                <button id="btn-chat" class="btn-icon" title="Chat Co-pilot">&#128172;</button>
            </div>
        </header>

        <main>
            <div id="scan-section">
                <button id="btn-scan" class="btn-primary">Scan Disk</button>
                <div id="scan-status" class="status-text"></div>
            </div>

            <div id="results-section" class="hidden">
                <div class="results-header">
                    <label><input type="checkbox" id="select-all"> Select All</label>
                    <div class="delete-group">
                        <button id="btn-delete" class="btn-danger" disabled>Delete Selected</button>
                        <select id="delete-method">
                            <option value="trash">Move to Trash</option>
                            <option value="permanent">Delete Permanently</option>
                        </select>
                    </div>
                </div>
                <div id="results-list"></div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn-close" data-close="settings-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <label>LLM Provider
                        <select id="set-provider">
                            <option value="claude">Claude (API)</option>
                            <option value="ollama">Ollama (Local)</option>
                        </select>
                    </label>
                    <div id="claude-settings">
                        <label>Claude API Key
                            <input type="password" id="set-claude-key" placeholder="sk-ant-...">
                        </label>
                        <label>Claude Model
                            <input type="text" id="set-claude-model" value="claude-sonnet-4-20250514">
                        </label>
                    </div>
                    <div id="ollama-settings" class="hidden">
                        <label>Ollama Model
                            <input type="text" id="set-ollama-model" value="llama3">
                        </label>
                        <label>Ollama URL
                            <input type="text" id="set-ollama-url" value="http://localhost:11434">
                        </label>
                    </div>
                    <button id="btn-save-settings" class="btn-primary">Save</button>
                </div>
            </div>
        </div>

        <!-- Chat Sidebar -->
        <div id="chat-sidebar" class="hidden">
            <div class="chat-header">
                <h3>Chat Co-pilot</h3>
                <button class="btn-close" data-close="chat-sidebar">&times;</button>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Ask about your files...">
                <button id="btn-send-chat" class="btn-primary">Send</button>
            </div>
        </div>

        <!-- Confirm Modal -->
        <div id="confirm-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Confirm Deletion</h2>
                    <button class="btn-close" data-close="confirm-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <p id="confirm-text"></p>
                    <div class="confirm-actions">
                        <button id="btn-confirm-yes" class="btn-danger">Delete</button>
                        <button class="btn-secondary" data-close="confirm-modal">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
